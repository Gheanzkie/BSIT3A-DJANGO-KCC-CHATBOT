{% extends "theme/base.html" %}
{% block content %}

<div class="page-header d-print-none">
  <div class="row align-items-center">
    <div class="col">
      <div class="page-pretitle">Admin</div>
      <h2 class="page-title"><i class="fas fa-pen me-2" style="color:var(--kcc-accent);"></i>Edit announcement</h2>
    </div>
    <div class="col-auto">
      <a href="{% url 'announcements' %}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-1"></i> Back
      </a>
    </div>
  </div>
</div>

<div class="row mt-2">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-body">
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Title <span class="text-muted">(optional)</span></label>
            <input type="text" name="title" maxlength="140" class="form-control" value="{{ item.title }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea name="message" rows="6" class="form-control" required>{{ item.message }}</textarea>
          </div>

          <div class="mb-3">
            <label class="form-label d-block">Published</label>
            <label class="form-check">
              <input type="checkbox" name="is_active" class="form-check-input" {% if item.is_active %}checked{% endif %}>
              <span class="form-check-label">Show in the Announcements page</span>
            </label>
          </div>

          {% if item.images.all %}
          <div class="mb-3">
            <label class="form-label d-block">Current pictures</label>
            <div class="row g-2">
              {% for picture in item.images.all %}
              <div class="col-sm-4">
                <img src="{{ picture.image.url }}" alt="" class="w-100 rounded" style="height:110px;object-fit:cover;">
                <label class="form-check mt-1">
                  <input type="checkbox" name="remove_images" value="{{ picture.pk }}" class="form-check-input">
                  <span class="form-check-label" style="font-size:0.78rem;">Remove this picture</span>
                </label>
              </div>
              {% endfor %}
            </div>
          </div>
          {% endif %}

          <div class="mb-3">
            <label class="form-label">Add pictures <span class="text-muted">(multiple allowed)</span></label>
            <input type="file" name="images" accept="image/*" multiple class="form-control">
          </div>

          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-1"></i> Save changes
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title>KCC Assistant Chatbot</title>
    <link href="{% static 'css/tabler.css' %}" rel="stylesheet"/>
    <link href="{% static 'css/app-theme.css' %}" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
      :root {
        --kcc-primary: #0b6e4f;
        --kcc-accent: #10b981;
      }

      /* body / page bg — match welcome + login dark theme */
      body, .page, .page-wrapper, .page-body {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%) !important;
        min-height: 100vh;
      }

      /* sidebar */
      .dh-sidebar {
        background: #1e293b !important;
        border-right: 1px solid rgba(255,255,255,0.06);
      }
      .dh-sidebar .nav-link {
        color: #94a3b8;
        border-radius: 8px;
        margin: 1px 8px;
      }
      .dh-sidebar .nav-link:hover {
        background: rgba(255,255,255,0.05);
        color: #e2e8f0;
      }
      .dh-sidebar .nav-link.active {
        background: rgba(16,185,129,0.12);
        color: var(--kcc-accent);
      }
      .dh-nav-section {
        color: #475569;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 0.75rem 1rem 0.25rem;
        display: block;
      }
      .dh-brand-name {
        font-weight: 700;
        font-size: 1rem;
        color: #f1f5f9;
      }
      .dh-brand-mark {
        width: 36px; height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--kcc-primary), var(--kcc-accent));
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1rem;
        box-shadow: 0 4px 15px rgba(16,185,129,0.3);
      }

      /* user card */
      .dh-user-card {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 0.75rem;
        border-radius: 10px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.06);
      }
      .dh-avatar {
        width: 36px; height: 36px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--kcc-primary), var(--kcc-accent));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.85rem;
        color: #fff;
        flex-shrink: 0;
      }
      .dh-user-name {
        color: #f1f5f9;
        font-weight: 600;
        font-size: 0.85rem;
      }
      .dh-user-role {
        color: #64748b;
        font-size: 0.7rem;
      }
      .dh-user-logout {
        color: #64748b;
        padding: 0.35rem;
        border-radius: 6px;
        transition: all 0.15s;
      }
      .dh-user-logout:hover {
        background: rgba(239,68,68,0.1);
        color: #f87171;
      }

      /* cards */
      .card {
        background: rgba(255,255,255,0.04) !important;
        border: 1px solid rgba(255,255,255,0.08) !important;
        border-radius: 14px;
      }
      .card-header {
        background: rgba(255,255,255,0.02);
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      .card-title { color: #f1f5f9; }
      .card-body { color: #cbd5e1; }

      /* page header */
      .page-pretitle { color: #64748b; text-transform: uppercase; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; }
      .page-title { color: #f8fafc; font-weight: 700; }

      /* tables */
      .table { color: #cbd5e1; }
      .table > :not(caption) > * > * { background: transparent; color: #cbd5e1; border-color: rgba(255,255,255,0.06); }
      .table thead th { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }

      /* forms */
      .form-control, .form-select {
        background: rgba(255,255,255,0.06);
        border-color: rgba(255,255,255,0.1);
        color: #f1f5f9;
      }
      .form-control:focus, .form-select:focus {
        background: rgba(255,255,255,0.08);
        border-color: var(--kcc-accent);
        color: #f1f5f9;
        box-shadow: 0 0 0 3px rgba(16,185,129,0.15);
      }
      .form-control::placeholder { color: #64748b; }
      .form-label { color: #cbd5e1; }

      /* select dropdown options — dark bg para kita ang text sa native option list */
      select, .form-select { color-scheme: dark; }
      select option, .form-select option {
        background-color: #1e293b;
        color: #e2e8f0;
      }
      select option:checked, .form-select option:checked {
        background-color: #0b6e4f;
        color: #ffffff;
      }

      /* buttons */
      .btn-primary {
        background: linear-gradient(135deg, var(--kcc-primary), var(--kcc-accent));
        border: none;
        color: #fff;
      }
      .btn-primary:hover {
        box-shadow: 0 4px 15px rgba(16,185,129,0.4);
        color: #fff;
      }

      /* footer */
      .dh-footer {
        border-top: 1px solid rgba(255,255,255,0.06);
        color: #64748b;
        background: transparent;
      }
      .dh-footer .link-secondary { color: #94a3b8; }

      /* modal — dark */
      .modal-content {
        background: #1e293b;
        border: 1px solid rgba(255,255,255,0.1);
        color: #e2e8f0;
      }
      .modal-header { border-bottom: 1px solid rgba(255,255,255,0.08); }
      .modal-footer { border-top: 1px solid rgba(255,255,255,0.08); }
      .modal-title { color: #f1f5f9; }

      /* alerts */
      .alert-danger {
        background: rgba(239,68,68,0.12);
        border-color: rgba(239,68,68,0.25);
        color: #fca5a5;
      }
      .alert-success {
        background: rgba(16,185,129,0.12);
        border-color: rgba(16,185,129,0.25);
        color: #6ee7b7;
      }

      /* pagination */
      .page-link {
        background: rgba(255,255,255,0.05);
        border-color: rgba(255,255,255,0.1);
        color: #cbd5e1;
      }
      .page-item.active .page-link {
        background: var(--kcc-accent);
        border-color: var(--kcc-accent);
        color: #fff;
      }

      /* badge */
      .badge.bg-success { background: rgba(16,185,129,0.2) !important; color: #6ee7b7; }
      .badge.bg-danger { background: rgba(239,68,68,0.2) !important; color: #fca5a5; }
    </style>
  </head>

  <body>
    <div class="page">

        {% if request.user.is_authenticated %}
            {% include 'theme/sidebar.html' %}
        {% endif %}

        <div class="page-wrapper">
            <div class="page-body">
                <div class="container-xl">
                    {% block content %}
                    {% endblock %}
                </div>
            </div>
            {% include 'theme/footer.html' %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/tabler.js' %}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>

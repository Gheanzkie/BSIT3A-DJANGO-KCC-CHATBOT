{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Sign in — KCC Assistant Chatbot</title>
  <link rel="icon" type="image/png" href="{% static 'img/kcc_logo.png' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --kcc-primary: #0b6e4f;
      --kcc-accent: #10b981;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        linear-gradient(135deg, rgba(15, 23, 42, 0.88) 0%, rgba(30, 41, 59, 0.78) 50%, rgba(15, 23, 42, 0.88) 100%),
        url("{% static 'img/kcc_backround.webp' %}") center / cover no-repeat;
      background-color: #0f172a;
      background-attachment: fixed;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .kcc-login-wrap {
      width: 100%;
      max-width: 420px;
    }

    .kcc-login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .kcc-login-brand img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(16, 185, 129, 0.3);
      margin-bottom: 1rem;
    }

    .kcc-login-brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 0.3rem;
    }

    .kcc-login-brand h1 span { color: var(--kcc-accent); }

    .kcc-login-brand p {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .kcc-login-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 2rem;
      backdrop-filter: blur(12px);
    }

    .kcc-login-card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .kcc-form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.4rem;
      display: block;
    }

    .kcc-form-input {
      width: 100%;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #f1f5f9;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .kcc-form-input::placeholder { color: #64748b; }

    .kcc-form-input:focus {
      border-color: var(--kcc-accent);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .kcc-form-group { margin-bottom: 1.25rem; }

    .kcc-btn-login {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--kcc-primary), var(--kcc-accent));
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .kcc-btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.45);
    }

    .kcc-login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .kcc-login-footer a {
      color: var(--kcc-accent);
      text-decoration: none;
      font-weight: 600;
    }

    .kcc-login-footer a:hover { text-decoration: underline; }

    .kcc-alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .kcc-back-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      color: #64748b;
      font-size: 0.8rem;
      text-decoration: none;
    }
    .kcc-back-link:hover { color: var(--kcc-accent); }
  </style>
</head>
<body>
  <div class="kcc-login-wrap">

    <!-- BRAND -->
    <div class="kcc-login-brand">
      <img src="{% static 'img/kcc_logo.png' %}" alt="KCC Logo">
      <h1>KCC <span>Assistant</span></h1>
      <p>Knowledge-Connected Companion</p>
    </div>

    <!-- CARD -->
    <div class="kcc-login-card">
      <h2>Sign in</h2>

      <form method="post">
        {% csrf_token %}

        {% if messages %}
          {% for message in messages %}
            <div class="kcc-alert-error">
              <i class="fas fa-circle-exclamation"></i> {{ message }}
            </div>
          {% endfor %}
        {% endif %}

        <div class="kcc-form-group">
          <label class="kcc-form-label">Email</label>
          <input type="email" class="kcc-form-input" name="email" autocomplete="off" placeholder="you@gmail.com" required>
        </div>

        <div class="kcc-form-group">
          <label class="kcc-form-label">Password</label>
          <input type="password" class="kcc-form-input" name="password" autocomplete="off" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="kcc-btn-login">
          <i class="fas fa-right-to-bracket"></i> Sign In
        </button>
      </form>

    </div>

    <a href="{% url 'welcome' %}" class="kcc-back-link">
      <i class="fas fa-arrow-left me-1"></i> Back to home
    </a>

  </div>
</body>
</html>
